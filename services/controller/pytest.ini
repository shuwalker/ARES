[pytest]
# Always treat the services/controller directory as the import root so `api.*` and
# `fastapi_app.*` resolve whether pytest is launched from the monorepo root
# (`services/controller/.venv/bin/python -m pytest services/controller/tests/...`) or from services/controller/.
pythonpath = . ../..
testpaths = tests
markers =
    integration: tests that hit the live test server or external integration surface
    reproduction: tests that execute a direct issue reproduction fixture
